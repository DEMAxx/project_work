on:
  push:
    branches:
      - v*

env:
  GO111MODULE: "on"

jobs:
  tests_by_makefile:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: ^1.24

      - name: Check out code
        uses: actions/checkout@v3

      - name: Install libvips-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev

      - name: make lint
        run: make lint

      - name: make build
        run: make build

      - name: make test
        run: make test